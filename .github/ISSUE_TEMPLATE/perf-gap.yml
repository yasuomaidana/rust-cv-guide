name: Performance gap
description: Report an operation where the Rust code is slower than OpenCV, or a benchmark that compares different work
labels: ["perf-gap"]
body:
  - type: input
    id: operation
    attributes:
      label: Operation
      description: The benchmark id from catalog/benchmarks.json, for example `smoothing_median`
    validations:
      required: true
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options: [image/imageproc, oximedia-cv, oxipix, another crate]
    validations:
      required: true
  - type: input
    id: ratio
    attributes:
      label: Measured gap vs OpenCV
      description: Rust time divided by OpenCV time, from `comparisons/opencv/run.sh`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, OpenCV version and whether it has a hardware abstraction layer (KleidiCV, IPP)
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Suspected cause
      description: What OpenCV does differently (algorithm, SIMD kernel, allocation), with a source link if you have one
