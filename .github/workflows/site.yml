# Site and catalog checks, and the GitHub Pages deploy from main. The Rust quality gates run in ci.yml (managed by dendrite).
name: site
on:
  push:
    branches: [develop, main, "RUSTCVGUID-*"]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    name: Catalog is consistent and generated pages are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q --locked -p cvg-tools -- check
      - run: cargo run -q --locked -p cvg-tools -- generate
      - name: Generated pages match what is committed
        run: git diff --exit-code -- website/docs && test -z "$(git status --porcelain website/docs)"
  build:
    name: Build site (broken links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The live examples are Rust compiled to WebAssembly; keep this in step with wasm-bindgen in live/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: website/build
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, catalog]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
