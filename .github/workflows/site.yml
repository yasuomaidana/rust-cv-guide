# Builds the Docusaurus site on every push and pull request, and deploys it to GitHub Pages from main.
name: site
on:
  push:
    branches: [develop, main, "RUSTCVGUID-*"]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
env:
  LOOM_GATE_REV: b3dd79d0190b29fe9815b21b30ca22c402c6f2be
jobs:
  quality:
    name: Quality gates (loc, clones, complexity, structure, rstest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/loom-gate
          key: loom-gate-${{ runner.os }}-${{ env.LOOM_GATE_REV }}
      - run: command -v loom-gate >/dev/null || cargo install --locked --git https://github.com/yasuomaidana/dendrite-rag-rs --rev "$LOOM_GATE_REV" loom-gate
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: loom-gate loc --format github
      - run: loom-gate clones --format github
      - run: loom-gate complexity --format github
      - run: loom-gate structure --format github
      - run: loom-gate rstest --format github
  coverage:
    name: Coverage floor (from directives)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          MIN=$(awk '/^\[coverage\]/{t=1;next} /^\[/{t=0} t && $1=="min_percent"{print int($3)}' .github/dendrite/directives.toml)
          cargo llvm-cov --ignore-filename-regex 'main.rs' --locked --fail-under-lines "$MIN"
  catalog:
    name: Catalog is consistent and generated pages are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q --locked -p cvg-tools -- check
      - run: cargo run -q --locked -p cvg-tools -- generate
      - name: Generated pages match what is committed
        run: git diff --exit-code -- website/docs && test -z "$(git status --porcelain website/docs)"
  build:
    name: Build site (broken links fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: website/build
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, quality, coverage, catalog]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
