[package]
name = "cvg-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Standalone release benchmark harness comparing OpenCV 5.1.0, image/imageproc, oximedia-cv, and oxipix"

[dependencies]
cvg-snippets = { path = "../../snippets" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
oximedia-codec = { version = "0.2", default-features = false }
oximedia-core = { version = "0.2", default-features = false }
oximedia-cv = { version = "0.2", default-features = false }
oxipix = "0.1"
# The imgproc kernels (OXI-94 to OXI-97) are not all released yet: benchmark them from their branch.
# Switch to a crates.io version once oxipix publishes them.
oxipix_next = { package = "oxipix", git = "https://github.com/yasuomaidana/oxipix", branch = "OXI-97-imgproc-parallel-feature-rayon-row-bands/main", default-features = false, features = ["imgproc", "parallel"] }
rayon = "1"
opencv = { version = "0.102", default-features = false, features = ["imgproc", "geometry"] }
cvg-opencv = { path = "../../snippets-opencv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rstest = "0.29"
