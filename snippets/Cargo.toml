[package]
name = "cvg-snippets"
version = "0.1.0"
edition = "2024"
publish = false
description = "Compiled examples shown in the Rust CV Guide; every page's code and printed numbers are tested here"

[dependencies]
# Pure Rust; no default features so it builds for wasm32 (no rayon-threaded FFT).
oximedia-cv = { version = "0.2", default-features = false }
# Frame types the quality metrics take; the same versions oximedia-cv uses.
oximedia-codec = { version = "0.2", default-features = false }
oximedia-core = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# Document capture: contour tracing and perspective unwarp. Default features only (no wgpu), so it builds for wasm32.
oxipix = "0.1"
imageproc = { version = "0.27", default-features = false }
rstest = "0.29"

